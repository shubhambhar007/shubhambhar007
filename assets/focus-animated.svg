<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Shubham's engineering focus</title>
  <desc id="desc">Animated cards showing AI systems, engineering craft, production scale, and working principles</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#060b18"/><stop offset=".55" stop-color="#0b1328"/><stop offset="1" stop-color="#090d1b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity=".12"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="290" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="290" fill="url(#panel)"/>
    <rect width="1200" height="290" fill="url(#dots)">
      <animateTransform attributeName="transform" type="translate" values="0 0;24 24" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="10" width="1180" height="270" rx="18" fill="none" stroke="#334155"/>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="48" y="51" fill="#64748b" font-size="12" font-weight="700" letter-spacing="4">ENGINEERING OPERATING SYSTEM</text>
      <circle cx="1127" cy="45" r="5" fill="#22c55e" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="1142" y="50" fill="#94a3b8" font-family="monospace" font-size="11">ONLINE</text>

      <!-- Focus -->
      <g transform="translate(38 78)">
        <rect width="267" height="164" rx="16" fill="#0c172d" stroke="#164e63">
          <animate attributeName="stroke" values="#164e63;#22d3ee;#164e63" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="22" y="32" fill="#22d3ee" font-family="monospace" font-size="12" letter-spacing="2">01 / FOCUS</text>
        <text x="22" y="72" fill="#f8fafc" font-size="23" font-weight="700">AI systems</text>
        <text x="22" y="101" fill="#94a3b8" font-size="14">Graph RAG · Agentic AI</text>
        <text x="22" y="124" fill="#94a3b8" font-size="14">Knowledge engineering · MCP</text>
        <path d="M22 143H218" stroke="#164e63"/><circle cx="22" cy="143" r="3" fill="#22d3ee" filter="url(#glow)">
          <animate attributeName="cx" values="22;218;22" dur="4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Craft -->
      <g transform="translate(323 78)">
        <rect width="267" height="164" rx="16" fill="#11142b" stroke="#4c1d95">
          <animate attributeName="stroke" values="#4c1d95;#a78bfa;#4c1d95" begin="2s" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="22" y="32" fill="#a78bfa" font-family="monospace" font-size="12" letter-spacing="2">02 / CRAFT</text>
        <text x="22" y="72" fill="#f8fafc" font-size="23" font-weight="700">Platform thinking</text>
        <text x="22" y="101" fill="#94a3b8" font-size="14">Backend · APIs · Retrieval</text>
        <text x="22" y="124" fill="#94a3b8" font-size="14">Developer experience · OSS</text>
        <g fill="#a78bfa" filter="url(#glow)">
          <circle cx="32" cy="143" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
          <circle cx="50" cy="143" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
          <circle cx="68" cy="143" r="3"><animate attributeName="opacity" values=".2;.2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
        </g>
      </g>

      <!-- Scale -->
      <g transform="translate(608 78)">
        <rect width="267" height="164" rx="16" fill="#151525" stroke="#78350f">
          <animate attributeName="stroke" values="#78350f;#f59e0b;#78350f" begin="4s" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="22" y="32" fill="#fbbf24" font-family="monospace" font-size="12" letter-spacing="2">03 / SCALE</text>
        <text x="22" y="72" fill="#f8fafc" font-size="23" font-weight="700">Distributed data</text>
        <text x="22" y="101" fill="#94a3b8" font-size="14">Kafka · Spark · Iceberg</text>
        <text x="22" y="124" fill="#94a3b8" font-size="14">High throughput · Low latency</text>
        <g transform="translate(22 149)" fill="#f59e0b">
          <rect width="18" height="5"><animate attributeName="height" values="5;13;5" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="0;-8;0" dur="2.1s" repeatCount="indefinite"/></rect>
          <rect x="25" width="18" height="5"><animate attributeName="height" values="5;20;5" begin="-.5s" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="0;-15;0" begin="-.5s" dur="2.1s" repeatCount="indefinite"/></rect>
          <rect x="50" width="18" height="5"><animate attributeName="height" values="5;27;5" begin="-1s" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="0;-22;0" begin="-1s" dur="2.1s" repeatCount="indefinite"/></rect>
          <rect x="75" width="18" height="5"><animate attributeName="height" values="5;17;5" begin="-1.5s" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="0;-12;0" begin="-1.5s" dur="2.1s" repeatCount="indefinite"/></rect>
        </g>
      </g>

      <!-- Principles -->
      <g transform="translate(893 78)">
        <rect width="267" height="164" rx="16" fill="#091b1b" stroke="#115e59">
          <animate attributeName="stroke" values="#115e59;#2dd4bf;#115e59" begin="6s" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="22" y="32" fill="#2dd4bf" font-family="monospace" font-size="12" letter-spacing="2">04 / PRINCIPLES</text>
        <text x="22" y="72" fill="#f8fafc" font-size="23" font-weight="700">Production first</text>
        <text x="22" y="101" fill="#94a3b8" font-size="14">Measurable · Explainable</text>
        <text x="22" y="124" fill="#94a3b8" font-size="14">Reliable · Operationally boring</text>
        <path d="M22 144l8 8 17-20" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" stroke-dashoffset="40">
          <animate attributeName="stroke-dashoffset" values="40;0;0" keyTimes="0;.35;1" dur="3s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <rect x="-280" y="69" width="280" height="2" fill="url(#beam)" filter="url(#glow)">
      <animate attributeName="x" values="-280;1200" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
